services:
  postgres:
    image: postgres:17
    container_name: urban-report-db
    environment:
      POSTGRES_DB: urbanreport
      POSTGRES_USER: urbanreport
      POSTGRES_PASSWORD: urbanreport
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: